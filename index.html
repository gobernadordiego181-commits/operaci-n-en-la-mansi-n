<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Acción Pro - Diego Gobernador</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #000; color: #fff; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; touch-action: manipulation; }
        .container { width: 100%; max-width: 450px; background: #121212; padding: 20px; border-radius: 15px; text-align: center; box-shadow: 0 0 20px rgba(3, 218, 198, 0.2); }
        .stats { color: #03DAC6; font-weight: bold; font-size: 1.2em; margin-bottom: 5px; }
        .arma-info { color: #BB86FC; font-size: 0.9em; margin-bottom: 15px; text-transform: uppercase; }
        .estado { font-size: 1.1em; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; color: #aaa; }
        .alerta { color: #ff1111; font-weight: bold; min-height: 24px; margin-bottom: 15px; visibility: hidden; }
        button { width: 100%; padding: 14px; margin: 6px 0; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.1s; text-transform: uppercase; -webkit-tap-highlight-color: transparent; }
        button:active { transform: scale(0.95); background-color: #555; }
        .btn-lugar { background-color: #333; color: white; }
        .btn-tienda { background-color: #CF6679; color: white; }
        .btn-disparar { background-color: #B00020; color: white; height: 100px; font-size: 22px; }
        .btn-ventana { background-color: #1976D2; color: white; height: 60px; }
        .btn-volver { background-color: #444; color: white; margin-top: 15px; }
        .btn-cerrar { background-color: #b71c1c; color: white; margin-top: 25px; border: 2px solid #ff5252; }
        
        .atm-screen { background: #002b36; border: 4px solid #555; border-radius: 10px; padding: 15px; margin-bottom: 15px; min-height: 60px; color: #00ff00; font-family: 'Courier New', monospace; }
        .atm-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 15px; }
        .btn-num { background: #333; color: white; padding: 15px; font-size: 18px; }

        .hidden { display: none !important; }
        #pantallaInicio { position: absolute; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 100; }
        
        .item-tienda { background: #222; padding: 10px; margin: 5px 0; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid #CF6679; text-align: left; }
        .item-nombre { font-size: 0.85em; flex-grow: 1; margin-right: 5px; }
    </style>
</head>
<body>

<div id="pantallaInicio" onclick="iniciarJuego()">
    <div class="container">
        <h2 style="color:#03DAC6">PROYECTO: DIEGO GOBERNADOR</h2>
        <p>Toca para iniciar sistema</p>
        <button class="btn-lugar">ENTRAR AL SISTEMA</button>
    </div>
</div>

<div id="gameContainer" class="container hidden">
    <div id="txtStats" class="stats">ACCIONES: 0 | BOLSILLO: $0</div>
    <div id="txtArmaActual" class="arma-info">EQUIPADA: PISTOLA</div>
    <div id="txtEstado" class="estado">CENTRO DE MANDO</div>
    <div id="txtAlertaEnemigo" class="alerta"></div>

    <div id="layoutMenu">
        <button class="btn-lugar" onclick="viajarA('SÓTANO', sonidos.sotano)">🧱 SÓTANO</button>
        <button class="btn-lugar" onclick="viajarA('GARAJE', sonidos.garaje)">🚗 GARAJE</button>
        <button class="btn-lugar" style="background-color: #FFD600; color: #000;" onclick="abrirCajero()">🏧 CAJERO AUTOMÁTICO</button>
        <button class="btn-lugar" onclick="viajarA('DORMITORIO', sonidos.dormitorio)">🛌 DORMITORIO</button>
        <button class="btn-lugar" onclick="viajarA('GIMNASIO', sonidos.gimnasio)">🏋️‍♂️ GIMNASIO</button>
        <button class="btn-lugar" style="background-color: #4CAF50;" onclick="viajarA('GRANJITA', sonidos.granjita)">🐥 GRANJITA</button>
        <button class="btn-tienda" onclick="abrirTienda()">🛒 TIENDA</button>
        <button class="btn-cerrar" onclick="cerrarJuego()">🚪 CERRAR JUEGO</button>
    </div>

    <div id="layoutCajero" class="hidden">
        <div class="atm-screen">
            <div id="mensajeATM">INSERTE TARJETA</div>
            <div id="montoATM" style="font-size: 24px; font-weight: bold; margin-top: 5px;"></div>
        </div>
        <button id="btnTarjeta" class="btn-lugar" style="background:#1976D2;" onclick="insertarTarjeta()">💳 INSERTAR TARJETA</button>
        <div id="controlesATM" class="hidden">
            <div class="atm-grid">
                <button class="btn-num" onclick="tecla('1')">1</button>
                <button class="btn-num" onclick="tecla('2')">2</button>
                <button class="btn-num" onclick="tecla('3')">3</button>
                <button class="btn-num" onclick="tecla('4')">4</button>
                <button class="btn-num" onclick="tecla('5')">5</button>
                <button class="btn-num" onclick="tecla('6')">6</button>
                <button class="btn-num" onclick="tecla('7')">7</button>
                <button class="btn-num" onclick="tecla('8')">8</button>
                <button class="btn-num" onclick="tecla('9')">9</button>
                <button class="btn-lugar" style="background:#c62828" onclick="borrar()">C</button>
                <button class="btn-num" onclick="tecla('0')">0</button>
                <button class="btn-lugar" style="background:#2e7d32; font-size:10px" onclick="verSaldo()">SALDO</button>
            </div>
            <button class="btn-lugar" style="background:#FFD600; color:black" onclick="retirar()">RETIRAR EFECTIVO</button>
        </div>
    </div>

    <div id="layoutTienda" class="hidden">
        <div id="listaTienda" style="max-height: 400px; overflow-y: auto;"></div>
    </div>

    <div id="layoutDisparos" class="hidden">
        <button id="btnAccionPrincipal" class="btn-disparar" onclick="disparar()">💥 ACCIÓN</button>
        <button id="btnAccionSecundaria" class="btn-ventana" onclick="disparar('VENTANA')">🪟 VENTANA</button>
        <button id="btnRiego" class="btn-lugar hidden" style="background-color: #03A9F4; margin-top: 10px;" onclick="activarRiego()">🚿 RIEGO</button>
    </div>

    <button id="btnVolver" class="btn-volver hidden" onclick="volver()">⬅️ REGRESAR</button>
</div>
