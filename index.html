<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Quiz - Desafío Total</title>
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --accent: #58a6ff;
            --success: #238636;
            --error: #da3633;
            --text: #c9d1d9;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            width: 90%;
            max-width: 500px;
            background: var(--card);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid #30363d;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }
        .header {
            display: flex;
            justify-content: space-between;
            font-size: 0.9em;
            margin-bottom: 20px;
            color: var(--accent);
        }
        #question {
            font-size: 1.3em;
            margin-bottom: 25px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .options {
            display: grid;
            gap: 12px;
        }
        button {
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #30363d;
            background: #21262d;
            color: white;
            font-size: 1em;
            cursor: pointer;
            transition: 0.2s;
        }
        button:active { transform: scale(0.98); }
        .correct { background: var(--success) !important; border-color: #3fb950; }
        .wrong { background: var(--error) !important; border-color: #f85149; }
        
        #score-screen { display: none; }
        .btn-restart { background: var(--accent); margin-top: 20px; width: 100%; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="quiz-screen">
        <div class="header">
            <span id="progress">Pregunta 1/10</span>
            <span id="current-score">Puntos: 0</span>
        </div>
        <div id="question">Cargando pregunta...</div>
        <div class="options" id="options-container">
            </div>
    </div>

    <div id="score-screen">
        <h2>¡Juego Terminado!</h2>
        <p id="final-stats"></p>
        <button class="btn-restart" onclick="startGame()">Jugar de Nuevo</button>
    </div>
</div>

<script>
    const questions = [
        { q: "¿Cuál es el planeta más grande del sistema solar?", a: ["Júpiter", "Saturno", "Marte", "Tierra"], c: 0 },
        { q: "¿En qué año llegó el hombre a la Luna?", a: ["1965", "1969", "1972", "1959"], c: 1 },
        { q: "¿Cuál es el animal más rápido del mundo?", a: ["Guepardo", "Halcón Peregrino", "Tiburón", "León"], c: 1 },
        { q: "¿Cuál es el metal cuyo símbolo químico es Au?", a: ["Plata", "Hierro", "Oro", "Cobre"], c: 2 },
        { q: "¿Quién pintó la Mona Lisa?", a: ["Picasso", "Van Gogh", "Da Vinci", "Dalí"], c: 2 },
        { q: "¿Cuál es el país más grande del mundo?", a: ["China", "Rusia", "Canadá", "USA"], c: 1 },
        { q: "¿Qué gas necesitamos para respirar?", a: ["Nitrógeno", "Helio", "Oxígeno", "Argón"], c: 2 },
        { q: "¿Cuál es el océano más grande?", a: ["Atlántico", "Índico", "Pacífico", "Ártico"], c: 2 },
        { q: "¿Cuántos huesos tiene el cuerpo humano adulto?", a: ["206", "150", "300", "210"], c: 0 },
        { q: "¿Cuál es la capital de Francia?", a: ["Londres", "París", "Berlín", "Roma"], c: 1 },
        { q: "¿Qué instrumento toca Lisa Simpson?", a: ["Trompeta", "Flauta", "Saxofón", "Piano"], c: 2 },
        { q: "¿Cuál es el río más largo del mundo?", a: ["Nilo", "Amazonas", "Misisipi", "Danubio"], c: 1 },
        { q: "¿Quién escribió 'Don Quijote de la Mancha'?", a: ["Cervantes", "Lorca", "Neruda", "Cortázar"], c: 0 },
        { q: "¿Cuántos continentes existen?", a: ["5", "6", "7", "4"], c: 1 },
        { q: "¿Qué país tiene forma de bota?", a: ["España", "Italia", "Grecia", "México"], c: 1 },
        { q: "¿Cuál es el elemento más abundante en el universo?", a: ["Oxígeno", "Helio", "Hidrógeno", "Carbono"], c: 2 },
        { q: "¿En qué país se encuentran las pirámides de Giza?", a: ["México", "Egipto", "Perú", "China"], c: 1 },
        { q: "¿Cuál es el idioma más hablado del mundo?", a: ["Inglés", "Chino Mandarín", "Español", "Hindi"], c: 1 },
        { q: "¿Cómo se llama el proceso por el cual las plantas hacen comida?", a: ["Respiración", "Fotosíntesis", "Ósmosis", "Digestión"], c: 1 },
        { q: "¿Cuál es el país con más habitantes?", a: ["India", "China", "Rusia", "Brasil"], c: 0 },
        { q: "¿Quién descubrió la penicilina?", a: ["Einstein", "Newton", "Alexander Fleming", "Pasteur"], c: 2 },
        { q: "¿Cuál es la moneda oficial de Japón?", a: ["Yuan", "Won", "Yen", "Dólar"], c: 2 },
        { q: "¿En qué año comenzó la Segunda Guerra Mundial?", a: ["1914", "1939", "1945", "1929"], c: 1 },
        { q: "¿Qué órgano bombea sangre al cuerpo?", a: ["Pulmón", "Cerebro", "Hígado", "Corazón"], c: 3 },
        { q: "¿Cuál es el monte más alto del mundo?", a: ["K2", "Everest", "Aconcagua", "Teide"], c: 1 },
        { q: "¿De qué colores es la bandera de México?", a: ["Verde, Blanco y Rojo", "Azul y Blanco", "Amarillo, Azul y Rojo", "Rojo y Blanco"], c: 0 },
        { q: "¿Cuántos minutos tiene una hora?", a: ["50", "100", "60", "120"], c: 2 },
        { q: "¿Qué tipo de animal es la ballena?", a: ["Pez", "Mamífero", "Reptil", "Anfibio"], c: 1 },
        { q: "¿Cuál es el color que resulta de mezclar azul y amarillo?", a: ["Morado", "Naranja", "Verde", "Gris"], c: 2 },
        { q: "¿Qué sistema del cuerpo se encarga de los huesos?", a: ["Muscular", "Óseo", "Nervioso", "Digestivo"], c: 1 },
        { q: "¿Cuál es la capital de Italia?", a: ["Venecia", "Milán", "Roma", "Nápoles"], c: 2 },
        { q: "¿Quién fue el primer presidente de Estados Unidos?", a: ["Lincoln", "Washington", "Jefferson", "Franklin"], c: 1 },
        { q: "¿A qué temperatura hierve el agua (C°)?", a: ["90", "120", "100", "80"], c: 2 },
        { q: "¿Qué animal dice 'miau'?", a: ["Perro", "Vaca", "Gato", "Pájaro"], c: 2 },
        { q: "¿Cómo se llama el satélite natural de la Tierra?", a: ["Marte", "Sol", "Luna", "Venus"], c: 2 },
        { q: "¿Cuántos lados tiene un hexágono?", a: ["5", "6", "7", "8"], c: 1 },
        { q: "¿Cuál es la ciudad de los rascacielos?", a: ["Madrid", "Nueva York", "Tokio", "París"], c: 1 },
        { q: "¿Qué inventaron los hermanos Wright?", a: ["Teléfono", "Bombilla", "Avión", "Coche"], c: 2 },
        { q: "¿Cuál es el país de origen del tequila?", a: ["España", "México", "Colombia", "Cuba"], c: 1 },
        { q: "¿Cuál es el ave nacional de USA?", a: ["Cóndor", "Águila Calva", "Halcón", "Búho"], c: 1 },
        { q: "¿Qué planeta es conocido como el planeta rojo?", a: ["Venus", "Marte", "Saturno", "Mercurio"], c: 1 },
        { q: "¿Cuál es el tercer planeta desde el sol?", a: ["Marte", "Venus", "Tierra", "Júpiter"], c: 2 },
        { q: "¿Qué buscador web es el más usado?", a: ["Bing", "Yahoo", "Google", "DuckDuckGo"], c: 2 },
        { q: "¿Quién escribió la Odisea?", a: ["Platón", "Homero", "Sócrates", "Aristóteles"], c: 1 },
        { q: "¿Cuál es el mineral más duro de la naturaleza?", a: ["Oro", "Hierro", "Diamante", "Cuarzo"], c: 2 },
        { q: "¿Cuál es el país con más pirámides?", a: ["Egipto", "Sudán", "México", "Perú"], c: 1 },
        { q: "¿Cuántas patas tiene una araña?", a: ["6", "8", "10", "4"], c: 1 },
        { q: "¿Cuál es la capital de España?", a: ["Barcelona", "Sevilla", "Madrid", "Valencia"], c: 2 },
        { q: "¿De qué país es el grupo ABBA?", a: ["Noruega", "Suecia", "Dinamarca", "Finlandia"], c: 1 },
        { q: "¿Qué nota musical sigue a Do?", a: ["Re", "Mi", "Fa", "Sol"], c: 0 }
    ];

    let currentIdx = 0;
    let score = 0;
    let shuffledQuestions = [];

    function startGame() {
        shuffledQuestions = questions.sort(() => Math.random() - 0.5).slice(0, 15); // 15 preguntas por sesión
        currentIdx = 0;
        score = 0;
        document.getElementById('quiz-screen').style.display = 'block';
        document.getElementById('score-screen').style.display = 'none';
        showQuestion();
    }

    function showQuestion() {
        const q = shuffledQuestions[currentIdx];
        document.getElementById('progress').innerText = `Pregunta ${currentIdx + 1}/${shuffledQuestions.length}`;
        document.getElementById('current-score').innerText = `Puntos: ${score}`;
        document.getElementById('question').innerText = q.q;
        
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        
        q.a.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(index, btn);
            container.appendChild(btn);
        });
    }

    function checkAnswer(idx, btn) {
        const correct = shuffledQuestions[currentIdx].c;
        const allBtns = document.querySelectorAll('.options button');
        
        allBtns.forEach(b => b.disabled = true);

        if (idx === correct) {
            btn.classList.add('correct');
            score += 10;
        } else {
            btn.classList.add('wrong');
            allBtns[correct].classList.add('correct');
        }

        setTimeout(() => {
            currentIdx++;
            if (currentIdx < shuffledQuestions.length) {
                showQuestion();
            } else {
                showScore();
            }
        }, 1200);
    }

    function showScore() {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('score-screen').style.display = 'block';
        document.getElementById('final-stats').innerText = `Puntuación Total: ${score} puntos de ${shuffledQuestions.length * 10}`;
    }

    startGame();
</script>

</body>
</html>
